---
layout: default
---

<article class="reading-container">
  <header class="author-header">
    <h1 class="author-title">{{ page.title }}</h1>
    {% if page.subtitle %}
      <p style="font-size: 1.15rem; color: var(--gold-light); font-style: italic; margin-top: 0.35rem;">
        {{ page.subtitle }}
      </p>
    {% endif %}
  </header>

  <div class="chapter-content drop-cap-p">
    {{ content }}
  </div>
</article>
