<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="auto">
  <defs>
    <linearGradient id="chartBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#091b13" />
      <stop offset="100%" stop-color="#06120d" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" rx="4" fill="url(#chartBg)" stroke="#d4af37" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Header -->
  <text x="40" y="40" font-family="'Cormorant Garamond', Georgia, serif" font-size="20" font-weight="700" fill="#f5f2ea">Fig. 1.2 · 24-Month Labor Absorption Matrix by Undergraduate Discipline</text>
  <text x="40" y="62" font-family="'Lora', Georgia, serif" font-size="12" fill="#879287">Percentage distribution of cohort status 24 months post-graduation ceremony</text>

  <!-- Table/Bar Header -->
  <g font-family="'Lora', Georgia, serif" font-size="11" fill="#c9c3b4" text-anchor="start">
    <text x="50" y="100">Discipline</text>
    <text x="260" y="100">Formal Sector</text>
    <text x="420" y="100">Informal / Hustle</text>
    <text x="580" y="100">Seeking / Underemployed</text>
  </g>
  <line x1="40" y1="110" x2="760" y2="110" stroke="#d4af37" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Row 1: Software & CS -->
  <g transform="translate(0, 140)">
    <text x="50" y="0" font-family="'Lora', Georgia, serif" font-size="13" font-weight="600" fill="#f5f2ea">Computer Science &amp; IT</text>
    <!-- Bar Stack: Formal 64%, Informal 22%, Seeking 14% -->
    <rect x="260" y="-12" width="280" height="18" fill="#071610" stroke="#d4af37" stroke-opacity="0.2" rx="2" />
    <rect x="260" y="-12" width="180" height="18" fill="#d4af37" rx="2" />
    <rect x="440" y="-12" width="62" height="18" fill="#b8933b" opacity="0.8" />
    <rect x="502" y="-12" width="38" height="18" fill="#3f5247" />
    <text x="560" y="2" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f5f2ea">64% Formal · 22% Inf · 14% Seek</text>
  </g>

  <!-- Row 2: Nursing & Health -->
  <g transform="translate(0, 190)">
    <text x="50" y="0" font-family="'Lora', Georgia, serif" font-size="13" font-weight="600" fill="#f5f2ea">Nursing &amp; Health Sciences</text>
    <rect x="260" y="-12" width="280" height="18" fill="#071610" stroke="#d4af37" stroke-opacity="0.2" rx="2" />
    <rect x="260" y="-12" width="162" height="18" fill="#d4af37" rx="2" />
    <rect x="422" y="-12" width="34" height="18" fill="#b8933b" opacity="0.8" />
    <rect x="456" y="-12" width="84" height="18" fill="#3f5247" />
    <text x="560" y="2" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f5f2ea">58% Formal · 12% Inf · 30% Seek</text>
  </g>

  <!-- Row 3: Engineering (Civil/Mech/Elec) -->
  <g transform="translate(0, 240)">
    <text x="50" y="0" font-family="'Lora', Georgia, serif" font-size="13" font-weight="600" fill="#f5f2ea">Engineering (Civil/Mech/Elec)</text>
    <rect x="260" y="-12" width="280" height="18" fill="#071610" stroke="#d4af37" stroke-opacity="0.2" rx="2" />
    <rect x="260" y="-12" width="137" height="18" fill="#d4af37" rx="2" />
    <rect x="397" y="-12" width="70" height="18" fill="#b8933b" opacity="0.8" />
    <rect x="467" y="-12" width="73" height="18" fill="#3f5247" />
    <text x="560" y="2" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f5f2ea">49% Formal · 25% Inf · 26% Seek</text>
  </g>

  <!-- Row 4: Commerce & Business Admin -->
  <g transform="translate(0, 290)">
    <text x="50" y="0" font-family="'Lora', Georgia, serif" font-size="13" font-weight="600" fill="#f5f2ea">Commerce &amp; Business Admin</text>
    <rect x="260" y="-12" width="280" height="18" fill="#071610" stroke="#d4af37" stroke-opacity="0.2" rx="2" />
    <rect x="260" y="-12" width="92" height="18" fill="#d4af37" rx="2" />
    <rect x="352" y="-12" width="115" height="18" fill="#b8933b" opacity="0.8" />
    <rect x="467" y="-12" width="73" height="18" fill="#3f5247" />
    <text x="560" y="2" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f5f2ea">33% Formal · 41% Inf · 26% Seek</text>
  </g>

  <!-- Row 5: Humanities & Social Sciences -->
  <g transform="translate(0, 340)">
    <text x="50" y="0" font-family="'Lora', Georgia, serif" font-size="13" font-weight="600" fill="#f5f2ea">Humanities &amp; General Arts</text>
    <rect x="260" y="-12" width="280" height="18" fill="#071610" stroke="#d4af37" stroke-opacity="0.2" rx="2" />
    <rect x="260" y="-12" width="62" height="18" fill="#d4af37" rx="2" />
    <rect x="322" y="-12" width="129" height="18" fill="#b8933b" opacity="0.8" />
    <rect x="451" y="-12" width="89" height="18" fill="#3f5247" />
    <text x="560" y="2" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f5f2ea">22% Formal · 46% Inf · 32% Seek</text>
  </g>

  <!-- Legend at bottom -->
  <g transform="translate(180, 395)" font-family="'Lora', Georgia, serif" font-size="11" fill="#c9c3b4">
    <rect x="0" y="-10" width="12" height="12" fill="#d4af37" rx="1"/>
    <text x="18" y="0">Formal Employment (Contracted)</text>

    <rect x="220" y="-10" width="12" height="12" fill="#b8933b" opacity="0.8" rx="1"/>
    <text x="238" y="0">Informal / Self-Employed</text>

    <rect x="410" y="-10" width="12" height="12" fill="#3f5247" rx="1"/>
    <text x="428" y="0">Active Search / Underemployed</text>
  </g>
</svg>
