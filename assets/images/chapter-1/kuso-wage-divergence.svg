<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#091b13" />
      <stop offset="100%" stop-color="#06120d" />
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#e6c86e" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="460" rx="4" fill="url(#bgGrad)" stroke="#d4af37" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Title & Subtitle -->
  <text x="40" y="42" font-family="'Cormorant Garamond', Georgia, serif" font-size="20" font-weight="700" fill="#f5f2ea" letter-spacing="0.5">Fig. 1.1 · Kenya Graduate Nominal Wage Trajectories (36-Month Cohort)</text>
  <text x="40" y="65" font-family="'Lora', Georgia, serif" font-size="12" fill="#879287">Median monthly earnings indexed from initial employment milestone · KUSO Sample (n=14,200)</text>

  <!-- Chart Grid -->
  <g stroke="#d4af37" stroke-opacity="0.12" stroke-width="1">
    <!-- Horizontal lines -->
    <line x1="80" y1="110" x2="740" y2="110" stroke-dasharray="3,3" />
    <line x1="80" y1="170" x2="740" y2="170" stroke-dasharray="3,3" />
    <line x1="80" y1="230" x2="740" y2="230" stroke-dasharray="3,3" />
    <line x1="80" y1="290" x2="740" y2="290" stroke-dasharray="3,3" />
    <line x1="80" y1="350" x2="740" y2="350" />
    
    <!-- Vertical lines -->
    <line x1="80" y1="90" x2="80" y2="350" />
    <line x1="245" y1="90" x2="245" y2="350" stroke-dasharray="2,4" />
    <line x1="410" y1="90" x2="410" y2="350" stroke-dasharray="2,4" />
    <line x1="575" y1="90" x2="575" y2="350" stroke-dasharray="2,4" />
    <line x1="740" y1="90" x2="740" y2="350" stroke-dasharray="2,4" />
  </g>

  <!-- Y-Axis Labels -->
  <g font-family="'JetBrains Mono', monospace" font-size="11" fill="#879287" text-anchor="end">
    <text x="70" y="114">KES 90k</text>
    <text x="70" y="174">KES 70k</text>
    <text x="70" y="234">KES 50k</text>
    <text x="70" y="294">KES 30k</text>
    <text x="70" y="354">KES 10k</text>
  </g>

  <!-- X-Axis Labels -->
  <g font-family="'Lora', Georgia, serif" font-size="12" fill="#c9c3b4" text-anchor="middle">
    <text x="80" y="375">Month 0</text>
    <text x="245" y="375">Month 12</text>
    <text x="410" y="375">Month 24</text>
    <text x="575" y="375">Month 36</text>
    <text x="740" y="375">Month 48</text>
  </g>

  <!-- Curve 1: STEM / Engineering / Computing (Gold Strong) -->
  <path d="M 80,310 Q 245,260 410,195 T 740,125" fill="none" stroke="url(#stemGrad)" stroke-width="3.5" />
  <!-- Curve 2: Commerce / Business / Economics (Muted Gold) -->
  <path d="M 80,325 Q 245,305 410,270 T 740,240" fill="none" stroke="#b8933b" stroke-width="2.2" stroke-dasharray="5,2" />
  <!-- Curve 3: Humanities & Social Sciences (Muted Moss/Slate) -->
  <path d="M 80,335 Q 245,325 410,315 T 740,295" fill="none" stroke="#5f776a" stroke-width="2" />

  <!-- Data point dots on STEM Curve -->
  <circle cx="80" cy="310" r="4.5" fill="#d4af37" stroke="#071610" stroke-width="2" />
  <circle cx="245" cy="255" r="4.5" fill="#d4af37" stroke="#071610" stroke-width="2" />
  <circle cx="410" cy="195" r="4.5" fill="#d4af37" stroke="#071610" stroke-width="2" />
  <circle cx="575" cy="155" r="4.5" fill="#d4af37" stroke="#071610" stroke-width="2" />
  <circle cx="740" cy="125" r="4.5" fill="#d4af37" stroke="#071610" stroke-width="2" />

  <!-- Annotation Marker at Month 24 divergence -->
  <line x1="410" y1="195" x2="410" y2="135" stroke="#d4af37" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="410" cy="135" r="3" fill="#d4af37" />
  <text x="420" y="132" font-family="'Lora', Georgia, serif" font-size="11" fill="#e6c86e" font-style="italic">STEM / Non-STEM divergence widens at +24 mo</text>

  <!-- Legend -->
  <g transform="translate(100, 415)" font-family="'Lora', Georgia, serif" font-size="11.5" fill="#f5f2ea">
    <!-- Item 1 -->
    <line x1="0" y1="-4" x2="25" y2="-4" stroke="#d4af37" stroke-width="3" />
    <text x="32" y="0">STEM &amp; Computing (+128% over 36mo)</text>
    
    <!-- Item 2 -->
    <line x1="290" y1="-4" x2="315" y2="-4" stroke="#b8933b" stroke-width="2" stroke-dasharray="5,2" />
    <text x="322" y="0">Commerce &amp; Finance (+42%)</text>
    
    <!-- Item 3 -->
    <line x1="510" y1="-4" x2="535" y2="-4" stroke="#5f776a" stroke-width="2" />
    <text x="542" y="0">Humanities &amp; Arts (+18%)</text>
  </g>
</svg>
